<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片批注 — TaskMate</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/annotation.css">
</head>
<body>
  <nav class="navbar">
    <a class="navbar-brand" href="dashboard.html">
      <div class="logo-icon">✓</div>
      TaskMate
    </a>
    <div class="navbar-actions">
      <div class="navbar-user" id="navbar-user" onclick="window.location.href='settings.html'">
        <div id="navbar-avatar"></div>
        <span class="navbar-user-name" id="navbar-name"></span>
      </div>
      <a href="messages.html" class="btn btn-ghost btn-sm">💬 消息中心</a>
      <a href="help.html" class="btn btn-ghost btn-sm">❓ 帮助中心</a>
      <button type="button" class="btn btn-ghost btn-sm" onclick="Session.clear();window.location.href='index.html'">退出</button>
    </div>
  </nav>

  <div class="anno-page">
    <div id="alert-container"></div>

    <!-- 页头 -->
    <div class="anno-header">
      <div class="anno-back-row">
        <a class="back-link" id="anno-back-link" href="dashboard.html">← 返回</a>
      </div>
      <div class="anno-header-row">
        <div>
          <div class="anno-title" id="anno-title">图片批注</div>
          <div class="anno-subtitle" id="anno-subtitle"></div>
        </div>
        <div class="anno-header-actions">
          <div class="anno-toolbar" id="anno-toolbar">
            <button type="button" class="btn btn-secondary btn-sm anno-tool-btn active" data-tool="pin" onclick="setTool('pin')" title="添加图钉批注">
              📌 图钉批注
            </button>
            <button type="button" class="btn btn-secondary btn-sm anno-tool-btn" data-tool="rect" onclick="setTool('rect')" title="框选区域批注">
              🔲 框选区域
            </button>
            <button type="button" class="btn btn-secondary btn-sm anno-tool-btn" data-tool="none" onclick="setTool('none')" title="浏览模式">
              ✋ 浏览
            </button>
          </div>
          <span class="anno-count" id="anno-count">0 条批注</span>
        </div>
      </div>
    </div>

    <!-- 主区域：画布 + 侧边栏 -->
    <div class="anno-layout">
      <!-- 画布区域 -->
      <div class="anno-canvas-area" id="anno-canvas-area">
        <div class="anno-canvas-controls">
          <button type="button" class="btn btn-ghost btn-sm btn-icon" onclick="zoomIn()" title="放大">🔍+</button>
          <span class="anno-zoom-label" id="anno-zoom-label">100%</span>
          <button type="button" class="btn btn-ghost btn-sm btn-icon" onclick="zoomOut()" title="缩小">🔍-</button>
          <button type="button" class="btn btn-ghost btn-sm btn-icon" onclick="zoomFit()" title="适应屏幕">↔️</button>
          <button type="button" class="btn btn-ghost btn-sm btn-icon" onclick="zoomReset()" title="原始大小">1:1</button>
        </div>
        <div class="anno-canvas-wrapper" id="anno-canvas-wrapper">
          <div class="anno-canvas" id="anno-canvas">
            <img class="anno-image" id="anno-image" alt="批注图片" draggable="false">
            <!-- 标注层 -->
            <svg class="anno-svg" id="anno-svg"></svg>
          </div>
        </div>
        <div class="anno-canvas-hint" id="anno-canvas-hint"></div>
      </div>

      <!-- 批注列表侧边栏 -->
      <div class="anno-sidebar">
        <div class="anno-sidebar-header">
          <div class="anno-sidebar-title">📌 批注列表</div>
          <div class="anno-filter-btns">
            <button type="button" class="btn btn-ghost btn-sm anno-filter-btn active" data-filter="all" onclick="filterAnnotations('all')">全部</button>
            <button type="button" class="btn btn-ghost btn-sm anno-filter-btn" data-filter="pending" onclick="filterAnnotations('pending')">待处理</button>
            <button type="button" class="btn btn-ghost btn-sm anno-filter-btn" data-filter="resolved" onclick="filterAnnotations('resolved')">已处理</button>
          </div>
        </div>
        <div class="anno-sidebar-body" id="anno-list">
          <div class="loading-hint" style="padding:24px;text-align:center">暂无批注，点击图片添加图钉</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 批注编辑弹窗 -->
  <div class="modal-overlay" id="anno-edit-modal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="anno-edit-title">添加批注</div>
        <button type="button" class="modal-close" onclick="cancelAnnotation()">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">批注内容 <span class="label-required">*</span></label>
          <textarea class="form-input textarea-resize" id="anno-edit-content" rows="4" placeholder="在这里写下你的批注意见...（例如：这里需要调整颜色 / 排版需要对齐 / 数据有误请核实）" maxlength="500"></textarea>
          <div class="form-hint" style="text-align:right"><span id="anno-char-count">0</span>/500</div>
          <div class="form-error hidden" id="anno-edit-error"></div>
        </div>
        <div class="form-group">
          <label class="form-label">严重程度</label>
          <div class="anno-severity-row">
            <label class="anno-severity-item">
              <input type="radio" name="anno-severity" value="info" checked>
              <span class="anno-severity-tag info">ℹ️ 建议</span>
            </label>
            <label class="anno-severity-item">
              <input type="radio" name="anno-severity" value="warning">
              <span class="anno-severity-tag warning">⚠️ 注意</span>
            </label>
            <label class="anno-severity-item">
              <input type="radio" name="anno-severity" value="critical">
              <span class="anno-severity-tag critical">🔴 严重</span>
            </label>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="cancelAnnotation()">取消</button>
        <button type="button" class="btn btn-primary" id="anno-edit-confirm" onclick="saveAnnotation()">保存批注</button>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/storage.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/annotation.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', initAnnotationPage);
  </script>
</body>
</html>
